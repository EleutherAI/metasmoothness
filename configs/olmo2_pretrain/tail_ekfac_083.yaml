steps:
- ekfac:
    index_cfg:
      run_path: runs/tail_ekfac_083/scores
      model: runs/tail_bank_083_full/retrained/base
      overwrite: true
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: lm_head
      distributed: &id001
        nproc_per_node: 6
        nnode: 1
      data: &id002
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_16k.hf
        split: train
        chunk_length: 0
    hessian_cfg:
      method: kfac
      ev_correction: true
    score_cfg:
      batch_size: 1024
    preprocess_cfg:
      unit_normalize: false
    hessian_pipeline_cfg:
      query: &id003
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/query_50.hf
        split: train
        chunk_length: 0
      query_aggregation: none
      inversion_cfg:
        damping_factor: 0.1
- validate:
    run_path: runs/tail_ekfac_083/validate
    model: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/olmo2_reinit
    overwrite: true
    scores: runs/tail_ekfac_083/scores/scores
    retrained_dir: runs/tail_bank_083_full
    data: *id002
    query: *id003
    batch_size: 50
    distributed: *id001
