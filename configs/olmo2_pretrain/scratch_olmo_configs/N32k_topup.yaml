run_path: /mnt/ssd-2/lucia/scratch_olmo/pipeline/
steps:
- magic:
    run_path: /mnt/ssd-2/lucia/scratch_olmo/N32k
    model: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/olmo2_reinit
    overwrite: false
    cleanup_ckpts: true
    data: &id002
      dataset: runs/ekfac_vs_n/datasets/train_32k.hf
      split: train
      chunk_length: 0
    query: &id003
      dataset: runs/ekfac_vs_n/datasets/query_50.hf
      split: train
      chunk_length: 0
    distributed: &id001
      nproc_per_node: 8
      nnode: 1
    eps_root: 1.0e-06
    optimizer: muon
    weight_decay: 0.1
    compile: true
    attn_implementation: sdpa
    batch_size: 128
    num_epochs: 6
    lr_schedule:
      lr_scheduler_type: polynomial
      lr: 0.009
      lr_start: 1.0e-06
      lr_end: 0.0009
      warmup_steps: 0.25
    subset_strategy: random
    num_subsets: 30
    subset_fraction: 0.01
    save_optimizer_state: false
    save_retrained_models: true
    skip_metagradient: true
    resume: true
    skip_existing_retrained: true
- ekfac:
    index_cfg:
      run_path: /mnt/ssd-2/lucia/scratch_olmo/N32k_scores
      model: /mnt/ssd-2/lucia/scratch_olmo/N32k/retrained/base
      overwrite: true
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: lm_head
      distributed: *id001
      data: *id002
    hessian_cfg:
      method: kfac
      ev_correction: true
    score_cfg:
      batch_size: 1024
    preprocess_cfg:
      unit_normalize: false
    hessian_pipeline_cfg:
      query: *id003
      query_aggregation: none
      inversion_cfg:
        damping_factor: 0.1
- validate:
    run_path: /mnt/ssd-2/lucia/scratch_olmo/N32k_validate
    model: gpt2
    overwrite: true
    scores: /mnt/ssd-2/lucia/scratch_olmo/N32k_scores/scores
    retrained_dir: /mnt/ssd-2/lucia/scratch_olmo/N32k
    data: *id002
    query: *id003
    batch_size: 50
