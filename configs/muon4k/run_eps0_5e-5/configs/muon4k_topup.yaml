run_path: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/pipeline/muon4k
steps:
- magic:
    run_path: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/N4k
    model: gpt2
    overwrite: false
    cleanup_ckpts: true
    data: &id002
      dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_4k.hf
      split: train
      chunk_length: 0
    query: &id003
      dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/query_50.hf
      split: train
      chunk_length: 0
    distributed: &id001
      nproc_per_node: 8
      nnode: 1
    eps_root: 0.0
    optimizer: muon
    weight_decay: 0.01
    compile: false
    attn_implementation: eager
    batch_size: 64
    num_epochs: 4
    lr_schedule:
      lr_scheduler_type: polynomial
      lr: 5.0e-05
      lr_start: 1.0e-06
      lr_end: 5.0e-06
      warmup_steps: 0.25
    subset_strategy: random
    num_subsets: 50
    subset_fraction: 0.01
    save_optimizer_state: false
    save_retrained_models: true
    skip_metagradient: true
    resume: true
    skip_existing_retrained: true
- ekfac:
    index_cfg:
      run_path: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/N4k_scores
      model: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/N4k/retrained/base
      overwrite: true
      projection_dim: 0
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: lm_head
      distributed: *id001
      data: *id002
    hessian_cfg:
      method: kfac
      ev_correction: true
    score_cfg:
      batch_size: 1024
    preprocess_cfg:
      unit_normalize: false
    hessian_pipeline_cfg:
      query: *id003
      query_aggregation: none
      inversion_cfg:
        damping_factor: 0.1
- validate:
    run_path: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/N4k_validate
    model: gpt2
    overwrite: true
    scores: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/N4k_scores/scores
    retrained_dir: /mnt/ssd-2/lucia/muon4k/run_eps0_5e-5/N4k
    data: *id002
    query: *id003
    batch_size: 50
