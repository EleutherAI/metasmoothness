run_path: /mnt/ssd-2/lucia/muon4k/powersweep/adam_p025/pipeline
steps:
- ekfac:
    index_cfg:
      run_path: /mnt/ssd-2/lucia/muon4k/powersweep/adam_p025/scores
      model: /mnt/ssd-2/lucia-adam-shampoo/run_adam/N4k/retrained/base
      overwrite: false
      projection_dim: 0
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: lm_head
      distributed:
        nproc_per_node: 8
        nnode: 1
      data: &id001
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_4k.hf
        split: train
        chunk_length: 0
    hessian_cfg:
      method: shampoo_p025
      ev_correction: false
    score_cfg:
      batch_size: 1024
    preprocess_cfg:
      unit_normalize: false
    hessian_pipeline_cfg:
      query: &id002
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/query_50.hf
        split: train
        chunk_length: 0
      query_aggregation: none
      inversion_cfg:
        damping_factor: 0.1
      resume: true
- validate:
    run_path: /mnt/ssd-2/lucia/muon4k/powersweep/adam_p025/validate
    model: gpt2
    overwrite: true
    scores: /mnt/ssd-2/lucia/muon4k/powersweep/adam_p025/scores/scores
    retrained_dir: /mnt/ssd-2/lucia-adam-shampoo/run_adam/N4k
    data: *id001
    query: *id002
    batch_size: 50
