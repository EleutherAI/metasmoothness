steps:
- metasmoothness:
    run_path: /mnt/ssd-2/lucia/muon4k/msolmo_scratch_16k
    model: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/olmo2_reinit
    overwrite: true
    fsdp: false
    precision: fp32
    data:
      dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_16k.hf
      split: train
      prompt_column: text
      chunk_length: 0
