steps:
- metasmoothness:
    run_path: /mnt/ssd-2/lucia/muon4k/metasmooth_muon_1e-4
    model: gpt2
    overwrite: true
    fsdp: false
    data:
      dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_4k.hf
      split: train
      chunk_length: 0
    distributed:
      nproc_per_node: 8
      nnode: 1
    optimizer: muon
    weight_decay: 0.01
    eps_root: 0.0
    batch_size: 64
    num_epochs: 4
    lr_schedule:
      lr_scheduler_type: polynomial
      lr: 0.0001
