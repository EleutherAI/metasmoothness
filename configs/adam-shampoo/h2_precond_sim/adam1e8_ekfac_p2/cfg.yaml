# H^-2 preconditioned similarity: EK-FAC, apply_power -2.0
# adam eps_root 1e-8 4k bs64 ep2 PER-EPOCH bank (/mnt/ssd-1/lucia/perepoch),
# per-epoch EK-FAC H^-1 baseline LDS 0.3095 [0.269, 0.351].
# Model = bank base re-exported from the readable DCP step_124.ckpt
# (bank's retrained/base/model.safetensors is 0600 will-owned); verified
# against the bank's query_loss_cache to 0.0022 nats.
# Scoring step only — validate runs separately on bergson-damping HEAD
# (bergson-wt lacks retrain_bank/query_loss_cache support).
run_path: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/adam1e8_ekfac_p2/pipeline
steps:
- ekfac:
    index_cfg:
      run_path: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/adam1e8_ekfac_p2/scores
      model: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/adam1e8_base_export/checkpoint-124
      overwrite: true
      projection_dim: 0
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: lm_head
      distributed:
        nproc_per_node: 1
        nnode: 1
      data: &id001
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_4k.hf
        split: train
        chunk_length: 0
    hessian_cfg:
      method: kfac
      apply_power: -2.0
      ev_correction: true
    score_cfg:
      batch_size: 1024
    preprocess_cfg:
      unit_normalize: false
    hessian_pipeline_cfg:
      query: &id002
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/query_50.hf
        split: train
        chunk_length: 0
      query_aggregation: none
      inversion_cfg:
        damping_factor: 0.1
      resume: false
