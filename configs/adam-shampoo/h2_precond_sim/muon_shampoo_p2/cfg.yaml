# H^-2 preconditioned similarity: Shampoo grid, apply_power -2.0
# Mirrors /mnt/ssd-2/lucia-adam-shampoo/shampoo_quarter_muon/quarter.yaml
# (muon eps1e-6 lr5e-5 4k bank; Shampoo apply_power -1.0 baseline = 0.5217)
run_path: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/muon_shampoo_p2/pipeline
steps:
- ekfac:
    index_cfg:
      run_path: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/muon_shampoo_p2/scores
      model: /mnt/ssd-2/lucia/muon4k/run/N4k/retrained/base
      overwrite: true
      projection_dim: 0
      token_batch_size: 1024
      max_batch_size: 64
      filter_modules: lm_head
      distributed:
        nproc_per_node: 1
        nnode: 1
      data: &id001
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_4k.hf
        split: train
        chunk_length: 0
    hessian_cfg:
      method: shampoo
      apply_power: -2.0
      ev_correction: false
    score_cfg:
      batch_size: 1024
    preprocess_cfg:
      unit_normalize: false
    hessian_pipeline_cfg:
      query: &id002
        dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/query_50.hf
        split: train
        chunk_length: 0
      query_aggregation: none
      inversion_cfg:
        damping_factor: 0.1
      resume: false
- validate:
    run_path: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/muon_shampoo_p2/validate
    model: gpt2
    overwrite: true
    scores: /mnt/ssd-2/lucia-adam-shampoo/h2_precond_sim/muon_shampoo_p2/scores/scores
    retrained_dir: /mnt/ssd-2/lucia/muon4k/run/N4k
    data: *id001
    query: *id002
    batch_size: 50
