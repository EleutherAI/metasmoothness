steps:
- metasmoothness:
    run_path: /mnt/ssd-2/lucia/wikitext_ms_eps1e8_bs64/ms
    model: gpt2
    overwrite: true
    fsdp: false
    data:
      dataset: EleutherAI/bergson-wikitext-512-chunks
      split: train
      prompt_column: text
      chunk_length: 0
    distributed:
      nproc_per_node: 8
      nnode: 1
    optimizer: adamw
    weight_decay: 0.01
    eps_root: 1.0e-08
    batch_size: 64
    num_epochs: 4
    seed: 42
    adam_beta1: 0.95
    adam_beta2: 0.975
    lr_schedule:
      lr: 0.0008
      lr_scheduler_type: polynomial
      lr_start: 1.0e-06
      lr_end: 8.0e-05
      warmup_steps: 0.25
      power: 1.0
    fd_step: 0.1
    direction_seed: 0
