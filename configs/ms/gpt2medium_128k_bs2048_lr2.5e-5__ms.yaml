steps:
- metasmoothness:
    overwrite: true
    model: gpt2-medium
    model_kwargs: resid_pdrop=0.0,attn_pdrop=0.0,embd_pdrop=0.0
    precision: fp32
    use_tf32_matmuls: false
    seed: 42
    distributed:
      nnode: 1
      nproc_per_node: 4
    data:
      dataset: /mnt/ssd-2/lucia/datasets_local/train_128k.hf
      split: train
      chunk_length: 0
    batch_size: 2048
    grad_accum_steps: 32
    num_epochs: 2
    lr_schedule:
      lr: 2.5e-05
      lr_scheduler_type: polynomial
      lr_start: 1.0e-06
      lr_end: 1.0e-05
      warmup_steps: 0.25
    optimizer: adamw
    adam_beta1: 0.95
    adam_beta2: 0.975
    adam_eps: 1.0e-08
    eps_root: 1.0e-17
    weight_decay: 0.01
    loss_reduction: mean
    run_path: /mnt/ssd-2/lucia/paper_runs/experiments/gpt2medium_128k_bs2048_lr2.5e-5/ms
    fd_step: 0.1
    direction_seed: 0
run_path: /mnt/ssd-2/lucia/paper_runs/experiments/gpt2medium_128k_bs2048_lr2.5e-5/ms
