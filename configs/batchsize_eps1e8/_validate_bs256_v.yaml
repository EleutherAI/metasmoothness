steps:
- validate:
    run_path: runs/bs_eps1e8/bs256_validate_v
    overwrite: true
    model: gpt2
    precision: fp32
    distributed:
      nnode: 1
      nproc_per_node: 1
    data:
      dataset: EleutherAI/bergson-wikitext-512-chunks
      split: train
      prompt_column: text
      chunk_length: 0
    lr_schedule:
      lr: 1.0e-05
      lr_scheduler_type: linear
      lr_start: 0.0
      lr_end: 0.0
      warmup_steps: 0
    batch_size: 8
    num_epochs: 1
    seed: 42
    adam_beta1: 0.95
    adam_beta2: 0.975
    eps_root: 1.0e-08
    optimizer: adamw
    weight_decay: 0.01
    query:
      dataset: EleutherAI/bergson-wikitext-512-chunks
      split: test[1:51]
      prompt_column: text
      chunk_length: 0
    query_method: mean
    num_subsets: 100
    subset_fraction: 0.0
    exclude_zero_scores: false
    scores: /mnt/ssd-1/lucia/bergson-damping/runs/bs_eps1e8/bs256_scores_q1_50_v.npy
    retrain_bank: runs/bs_eps1e8/bs256_bank_v
