# Same as examples/magic/gpt2_wikitext_bank.yaml (GPT-2 / WikiText fine-tune,
# eps_root 1e-8, 4 epochs, 100 subsets, full leave-k-out retraining) but with
# optimizer=muon (same validated GPT-2/WikiText schedule, lr 0.0008).

# Run with `PYTHONHASHSEED=0 bergson runs/gpt2_muon_wikitext_bank.yaml`

steps:
  - magic:
      run_path: runs/gpt2_muon_wikitext_bank
      model: gpt2
      overwrite: true
      cleanup_ckpts: false

      data:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "train"
        chunk_length: 0

      query:
        dataset: EleutherAI/bergson-wikitext-512-chunks
        split: "test[0:1]"
        chunk_length: 0

      distributed:
        nproc_per_node: 8
        nnode: 1

      eps_root: 1e-8
      optimizer: muon
      weight_decay: 0.01

      batch_size: 64
      num_epochs: 4
      lr_schedule:
        lr_scheduler_type: polynomial
        lr: 0.00008
        lr_start: 1e-6
        lr_end: 0.000008
        warmup_steps: 0.25

      subset_strategy: random
      num_subsets: 100
      subset_fraction: 0.01
      save_models: True
