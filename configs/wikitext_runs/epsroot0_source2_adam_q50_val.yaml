steps:
- validate:
    run_path: runs/epsroot0_source2_adam_q50_validate
    model: gpt2
    overwrite: true
    scores: runs/epsroot0_source2_adam_q50/scores
    retrained_dir: runs/epsroot0_bank
    data:
      dataset: EleutherAI/bergson-wikitext-512-chunks
      split: train
      chunk_length: 0
    query:
      dataset: EleutherAI/bergson-wikitext-512-chunks
      split: test[1:51]
      chunk_length: 0
    batch_size: 64
