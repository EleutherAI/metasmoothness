steps:
- metasmoothness:
    run_path: /mnt/ssd-1/lucia/perepoch/runs/adam_eps1e8_4k_drop0/ms
    model: gpt2
    overwrite: true
    fsdp: false
    model_kwargs: resid_pdrop=0.0,attn_pdrop=0.0,embd_pdrop=0.0
    data:
      dataset: /mnt/ssd-1/lucia/bergson-damping/runs/ekfac_vs_n/datasets/train_4k.hf
      split: train
      chunk_length: 0
    distributed:
      nproc_per_node: 8
      nnode: 1
    optimizer: adamw
    weight_decay: 0.01
    eps_root: 1.0e-8
    batch_size: 64
    num_epochs: 2
    seed: 42
    adam_beta1: 0.95
    adam_beta2: 0.975
    lr_schedule:
      lr_scheduler_type: polynomial
      lr: 8.0e-4
      lr_start: 1.0e-06
      lr_end: 8.0e-5
      warmup_steps: 0.25
    fd_step: 0.1
    direction_seed: 0
