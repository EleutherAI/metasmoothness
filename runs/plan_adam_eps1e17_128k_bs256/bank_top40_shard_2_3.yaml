steps:
- validate:
    run_path: /mnt/ssd-2/lucia/paper_runs/experiments/plan_adam_eps1e17_128k_bs256/bank_top40
    model: gpt2
    model_kwargs: resid_pdrop=0.0,attn_pdrop=0.0,embd_pdrop=0.0
    precision: fp32
    use_tf32_matmuls: false
    seed: 42
    distributed:
      nnode: 1
      nproc_per_node: 2
    data:
      dataset: /mnt/ssd-2/lucia/datasets_local/train_128k.hf
      split: train
      chunk_length: 0
    query:
      dataset: /mnt/ssd-2/lucia/datasets_local/query_20.hf
      split: train
      chunk_length: 0
    batch_size: 256
    grad_accum_steps: 8
    num_epochs: 2
    lr_schedule:
      lr: 0.0002
      lr_scheduler_type: polynomial
      lr_start: 1.0e-06
      lr_end: 2.0e-05
      warmup_steps: 0.25
    optimizer: adamw
    adam_beta1: 0.95
    adam_beta2: 0.975
    adam_eps: 1.0e-08
    eps_root: 1.0e-17
    weight_decay: 0.01
    loss_reduction: mean
    num_subsets: 3
    subset_fraction: 0.0003125
    query_method: none
    save_models: true
    save_mode: interval
    method: lds
    scores: /mnt/ssd-2/lucia/paper_runs/experiments/plan_adam_eps1e17_128k_bs256/ekfac_scores/scores
    save_interval: 1000000000
    subset_start: 2
    subset_stop: 3
    subsets: /mnt/ssd-2/lucia/paper_runs/experiments/plan_adam_eps1e17_128k_bs256/bank_top40/subsets.json
    resume: true
    overwrite: false
run_path: /mnt/ssd-2/lucia/paper_runs/experiments/plan_adam_eps1e17_128k_bs256/bank_top40
