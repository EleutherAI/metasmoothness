steps:
- validate:
    run_path: /mnt/ssd-2/lucia/paper_runs/experiments/plan_muon_eps1e17_64k_bs32/bank_from_filter
    model: gpt2
    model_kwargs: resid_pdrop=0.0,attn_pdrop=0.0,embd_pdrop=0.0
    precision: fp32
    use_tf32_matmuls: false
    seed: 42
    distributed:
      nnode: 1
      nproc_per_node: 2
    data:
      dataset: /mnt/ssd-2/lucia/datasets_local/train_64k.hf
      split: train
      chunk_length: 0
    query:
      dataset: /mnt/ssd-2/lucia/datasets_local/query_20.hf
      split: train
      chunk_length: 0
    batch_size: 32
    grad_accum_steps: 1
    num_epochs: 2
    lr_schedule:
      lr: 2.5e-05
      lr_scheduler_type: polynomial
      lr_start: 1.0e-06
      lr_end: 2.5e-06
      warmup_steps: 0.25
    optimizer: muon
    adam_beta1: 0.95
    adam_beta2: 0.975
    adam_eps: 1.0e-08
    eps_root: 1.0e-17
    weight_decay: 0.01
    loss_reduction: mean
    num_subsets: 100
    subset_fraction: 0.01
    query_method: none
    save_models: true
    save_mode: interval
    method: lds
    scores: /mnt/ssd-2/lucia/paper_runs/experiments/plan_muon_eps1e17_64k_bs32/ekfac_scores/scores
    save_interval: 1000000000
    subset_start: 95
    subset_stop: 100
    subsets: /mnt/ssd-2/lucia/paper_runs/experiments/plan_muon_eps1e17_64k_bs32/bank_from_filter/subsets.json
    resume: true
    overwrite: false
run_path: /mnt/ssd-2/lucia/paper_runs/experiments/plan_muon_eps1e17_64k_bs32/bank_from_filter
